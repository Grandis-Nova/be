name: build

on:
  pull_request:
    branches: [main, 'epic/**']
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 실제 MySQL·Redis 가 필요한 통합 시험(member 25건 이상, common:security 9건)이 있다. 서비스가 없으면 그 시험들이 skip 이 아니라
    # 실패한다(TestInfra: CI 환경변수가 있으면 assumeTrue 대신 AssertionError) — 그물이 조용히 비는 것을 막는다.
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # 스키마는 docs/schema.sql 이 정본(shop · external_mock 두 스키마). 시험은 nova/nova-local 로 127.0.0.1:3306 에 붙는다.
      - name: apply schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot < docs/schema.sql
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE USER 'nova'@'%' IDENTIFIED BY 'nova-local'; GRANT ALL ON shop.* TO 'nova'@'%'; GRANT ALL ON external_mock.* TO 'nova'@'%';"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # 모듈 전부를 빌드한다. 어느 모듈이 깨져도 여기서 잡힌다.
      - run: ./gradlew build --no-daemon

      # 초록과 별개로 "시험이 정말 돌았는가" 를 로그에 남긴다. skipped 가 0 이 아니면 인프라 전제가 빠진 것이다.
      - name: test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          tot = {'tests': 0, 'skipped': 0, 'failures': 0, 'errors': 0}; per = {}
          for f in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(f).read())
              if not m: continue
              mod = f.split('/build/')[0]; per[mod] = per.get(mod, 0) + int(m.group(1))
              for k, v in zip(tot, m.groups()): tot[k] += int(v)
          print('TEST SUMMARY', tot, per)
          PY

      # 실패해도 리포트는 남긴다. 어느 테스트가 깨졌는지 보려면 이게 필요하다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 히스토리 전체를 봐야 과거 커밋에 박힌 키도 잡는다

      # .gitignore 는 *.yml 만 막는다. 코드에 하드코딩된 서명 키·카카오 시크릿은 못 막는다.
      # 한 번 푸시되면 히스토리에서 지우는 게 고통스러우므로 들어가기 전에 잡는다.
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose
