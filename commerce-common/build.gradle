// 실행되지 않는 공통 라이브러리. 모든 서비스가 의존한다.
// 공통 응답 · 예외 · JWT 검증 · 여러 도메인이 쓰는 VO 만 둔다. 업무 로직은 두지 않는다.
apply plugin: 'java-library'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'org.springframework:spring-web'          // 공통 응답·예외 매핑용
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'         // JWT 검증 (발급은 member)
}
